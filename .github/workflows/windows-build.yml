name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Anjian2026.sln
      - name: Build
        run: dotnet build Anjian2026.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/Anjian.Core.Tests/Anjian.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=Anjian-Core.trx"
      - name: Verify API handbook generation
        run: dotnet run --project tools/Anjian.ApiDocsGenerator/Anjian.ApiDocsGenerator.csproj -c Release --no-build -- --check
      - name: Publish portable Windows x64
        run: dotnet publish src/Anjian.App/Anjian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish/win-x64
      - name: Test Image Resource Manager WinForms layout
        shell: pwsh
        run: |
          $smokeOutput = Join-Path $env:RUNNER_TEMP "MouscriptStudio-ImageResourceUiSmoke.txt"
          $smokeError = Join-Path $env:RUNNER_TEMP "MouscriptStudio-ImageResourceUiSmoke.err"
          $smoke = Start-Process -FilePath "artifacts/publish/win-x64/Anjian.App.exe" -ArgumentList "--image-resource-ui-smoke-test" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $smokeOutput -RedirectStandardError $smokeError
          if (Test-Path $smokeOutput) { Get-Content $smokeOutput }
          if (Test-Path $smokeError) { Get-Content $smokeError }
          if ($smoke.ExitCode -ne 0) { throw "Image Resource Manager UI smoke test failed with exit code $($smoke.ExitCode)" }
      - name: Test packaged sprite runtime and Worker
        shell: pwsh
        run: |
          $env:ANJIAN_PUBLISHED_RUNTIME = (Resolve-Path "artifacts/publish/win-x64").Path
          dotnet test tests/Anjian.Core.Tests/Anjian.Core.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~PublishedRuntimeBuildsAndRunsAnIndependentSpriteWorker|FullyQualifiedName~PublishedRuntimeBuildsAndRunsAnIndependentPluginWorker|FullyQualifiedName~PublishedRuntimeRunsTwoWorkersConcurrentlyAndStopsIndependently|FullyQualifiedName~PublishedRuntimeExposesCoordinatorStateEventsAndIsolatedInstanceLogs" --logger "console;verbosity=normal"
      - name: Package and checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $productVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("artifacts/publish/win-x64/Anjian.App.exe").ProductVersion
          if (-not $productVersion.StartsWith($version)) { throw "ProductVersion mismatch: $productVersion vs $version" }
          $productId = (Get-Content PRODUCT_ID -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($productId)) { throw "PRODUCT_ID is empty" }
          $zip = "$productId-$version-win-x64.zip"
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath "artifacts/$zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "artifacts/$zip.sha256" -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anjian2026-preview-win-x64
          path: |
            artifacts/MouscriptStudio-*.zip
            artifacts/MouscriptStudio-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Read release version
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $productName = (Get-Content PRODUCT_NAME -Raw).Trim()
          $productId = (Get-Content PRODUCT_ID -Raw).Trim()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "product_name=$productName" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "product_id=$productId" -Encoding utf8
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_version.outputs.product_name }} v${{ steps.release_version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/${{ steps.release_version.outputs.product_id }}-*.zip
            artifacts/${{ steps.release_version.outputs.product_id }}-*.zip.sha256
